services:
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3080:8080
    env_file: .env
    networks:
      - default
      - wud_default
    labels:
      glance.name: Glance
      glance.icon: si:glance
      glance.url: https://fibrilinux.burmese-neon.ts.net:3081
      glance.description: Personal Dashboard

networks:
  wud_default:
    external: true
