- name: Norway
  slug: norway
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Europe/Oslo
              label: Trondheim

        - type: custom-api
          title: NOK rate
          cache: 6h
          url: https://open.er-api.com/v6/latest/NOK
          template: |
            <ul class="list list-gap-10">
              <li class="flex justify-between"><span>THB</span><span class="color-highlight">{{ .JSON.Float "rates.THB" | printf "%.3f" }}</span></li>
              <li class="flex justify-between"><span>MMK</span><span>{{ .JSON.Float "rates.MMK" | printf "%.1f" }}</span></li>
              <li class="flex justify-between"><span>JPY</span><span>{{ .JSON.Float "rates.JPY" | printf "%.2f" }}</span></li>
              <li class="flex justify-between"><span>USD</span><span>{{ .JSON.Float "rates.USD" | printf "%.4f" }}</span></li>
              <li class="flex justify-between"><span>EUR</span><span>{{ .JSON.Float "rates.EUR" | printf "%.4f" }}</span></li>
            </ul>
            <div class="size-h6 margin-top-10">per 1 NOK · MMK is the official CBM rate · {{ .JSON.String "time_last_update_utc" | trimSuffix " +0000" }}</div>

    - size: full
      widgets:
        - type: group
          title: "NRK"
          widgets:
            - type: rss
              title: Trøndelag
              style: detailed-list
              limit: 20
              collapse-after: 8
              cache: 30m
              feeds:
                - url: https://www.nrk.no/trondelag/toppsaker.rss
            - type: rss
              title: Toppsaker
              style: detailed-list
              limit: 20
              collapse-after: 8
              cache: 30m
              feeds:
                - url: https://www.nrk.no/toppsaker.rss
            - type: rss
              title: Norge
              style: detailed-list
              limit: 20
              collapse-after: 8
              cache: 30m
              feeds:
                - url: https://www.nrk.no/norge/toppsaker.rss
            - type: rss
              title: Urix
              style: detailed-list
              limit: 20
              collapse-after: 8
              cache: 30m
              feeds:
                - url: https://www.nrk.no/urix/toppsaker.rss

    - size: small
      widgets:
        - type: weather
          title: Trondheim
          location: Trondheim, Norway
          units: metric
          hour-format: 24h

        # Aurora outlook: scripts/aurora_cache.py (cron */30) -> assets/aurora/aurora.json.
        # NOAA SWPC Kp now + forecast, NOAA OVATION cell for Trondheim, Open-Meteo clouds/sun.
        # Styles: .aurora-* in assets/user.css.
        - type: custom-api
          title: Aurora · Trondheim
          title-url: https://www.swpc.noaa.gov/products/aurora-30-minute-forecast
          cache: 15m
          url: http://localhost:8080/assets/aurora/aurora.json
          template: |
            <div class="aurora">
              <div class="aurora-verdict {{ .JSON.String "verdict_level" }}">{{ .JSON.String "verdict" }}</div>
              <div class="aurora-line"><span>Kp now</span><span>{{ printf "%.1f" (.JSON.Float "kp_now") }} <span class="aurora-sub">{{ .JSON.String "kp_now_level" }}</span></span></div>
              <div class="aurora-line"><span>Tonight</span><span>max Kp {{ printf "%.1f" (.JSON.Float "tonight.kp_max") }} <span class="aurora-sub">{{ .JSON.String "tonight.start" }}–{{ .JSON.String "tonight.end" }}</span></span></div>
              <div class="aurora-spark" title="Kp forecast in 3-hour steps (scale 0–9); line at Kp 3">
                {{ range .JSON.Array "tonight.kp_steps" }}
                <div class="aurora-step"><span class="aurora-bar {{ if ge (.Float "kp") 3.0 }}hot{{ end }}" style="height: {{ mul (div (.Float "kp") 9.0) 100.0 }}%"></span><span class="aurora-t">{{ .String "t" }}</span></div>
                {{ end }}
              </div>
              {{ if ne (.JSON.String "tonight.cloud_mean") "" }}
              <div class="aurora-line"><span>Clouds</span><span>{{ .JSON.Int "tonight.cloud_start" }}% → {{ .JSON.Int "tonight.cloud_end" }}% <span class="aurora-sub">min {{ .JSON.Int "tonight.cloud_min" }}%</span></span></div>
              {{ end }}
              {{ if ne (.JSON.String "ovation.pct") "" }}
              <div class="aurora-line" title="NOAA OVATION aurora value (0–100) for this grid cell, about an hour ahead. Not a local % chance."><span>NOAA model</span><span>{{ .JSON.Int "ovation.pct" }} <span class="aurora-sub">of 100 · OVATION</span></span></div>
              {{ end }}
              <div class="aurora-foot" title="Kp is a planet-wide 0–9 index, not where the aurora is: a rough guide only.">
                <b>Kp 2–3</b> north sky · <b>4+</b> brighter · <b>5+</b> overhead<br>
                Rough guide; needs dark and clear sky.
              </div>
            </div>
