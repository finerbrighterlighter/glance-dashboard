server:
  assets-path: /app/assets

theme:
  # Editorial system shared with the YNAB + usage dashboards
  # (~/Sandbox/ynab/dashboard/style.css): dark paper #15171a, ink #e9e7e0, accent #dcb85a
  background-color: 216 11 9
  contrast-multiplier: 1.1
  primary-color: 43 65 61
  positive-color: 120 24 59
  negative-color: 356 62 68

  disable-picker: false
  presets:
    editorial-light:
      light: true
      # paper #f3f3ef, ink #1b1d20, accent #8a5a0c
      background-color: 60 14 95
      contrast-multiplier: 1.1
      primary-color: 37 84 29
      positive-color: 123 23 39
      negative-color: 358 66 34

    rose-pine:
      background-color: 249 22 12
      contrast-multiplier: 1.0
      primary-color: 2 55 83
      positive-color: 189 43 73
      negative-color: 343 76 68
  custom-css-file: /assets/user.css


pages:
  # It's not necessary to create a new file for each page and include it, you can simply
  # put its contents here, though multiple pages are easier to manage when separated
  - $include: home.yml
  - $include: homelab.yml
  - $include: fun.yml
  - $include: norway.yml
