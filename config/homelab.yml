- name: Homelab
  slug: homelab
  columns:
    - size: small
      widgets:
        - type: server-stats
          servers:
            - type: local
              name: Fibrilinux
              hide-mountpoints-by-default: true
              mountpoints:
                "/":
                  hide: false
                  name: Root

        # AI usage: the usage dashboard's /api/now (~/Sandbox/usage_dashboard, collector */5 min),
        # read over Tailscale Serve (the dashboard only listens on 127.0.0.1). Styles: .usage-* in user.css.
        # OpenRouter is prepaid credit: balance + runway, never a % bar.
        - type: custom-api
          title: AI usage
          title-url: https://fibrilinux.burmese-neon.ts.net:8084
          cache: 5m
          url: https://fibrilinux.burmese-neon.ts.net:8084/api/now
          template: |
            {{ $now := .JSON.Int "now" }}{{ $prev := "" }}
            <div class="usage">
              {{ range .JSON.Array "cards" }}
              {{ $p := .String "provider" }}
              {{ if ne $p $prev }}
              <div class="usage-provider">{{ if eq $p "claude" }}Claude{{ else if eq $p "codex" }}Codex{{ else if eq $p "copilot" }}Copilot{{ else if eq $p "openrouter" }}OpenRouter{{ else }}{{ $p }}{{ end }}</div>
              {{ $prev = $p }}{{ end }}
              <div class="usage-row {{ if .Bool "stale" }}stale{{ end }}">
                {{ if .Exists "credit.balance" }}
                <div class="usage-head">
                  <span>${{ printf "%.2f" (.Float "credit.balance") }} left</span>
                  <span class="usage-pace">{{ if ne (.String "credit.runway_days") "" }}~{{ printf "%.0f" (.Float "credit.runway_days") }} days{{ end }}</span>
                </div>
                <div class="usage-foot">${{ printf "%.2f" (.Float "credit.burn_per_day") }}/day · {{ .String "credit.burn_basis" }}{{ if .Bool "stale" }} · stale{{ end }}</div>
                {{ else }}
                {{ $u := .Float "used_pct" }}{{ $proj := .Float "projected_pct" }}
                {{ $w := $u }}{{ if gt $w 100.0 }}{{ $w = 100.0 }}{{ end }}
                <div class="usage-head">
                  <span>{{ .String "label" }}</span>
                  <span class="usage-pct {{ if ge $u 100.0 }}hi{{ end }}">{{ printf "%.0f" $u }}%</span>
                </div>
                <div class="usage-bar" title="{{ printf "%.0f" $u }}% used{{ if ne (.String "elapsed_pct") "" }}, {{ printf "%.0f" (.Float "elapsed_pct") }}% of the window gone; heading to {{ printf "%.0f" $proj }}%{{ end }}">
                  <span class="usage-fill {{ if ge $proj 100.0 }}hi{{ end }}" style="width: {{ $w }}%"></span>
                  {{ if and (ne (.String "elapsed_pct") "") (not (.Bool "idle")) }}<span class="usage-tick" style="left: {{ .Float "elapsed_pct" }}%"></span>{{ end }}
                </div>
                <div class="usage-foot">
                  {{ if .Bool "stale" }}stale{{ else if .Bool "idle" }}idle{{ else }}<span class="usage-pace {{ if ge $proj 100.0 }}hi{{ else if eq (.String "pace_label") "ahead" }}mid{{ end }}">{{ .String "pace_label" }}</span>{{ end }}
                  {{ if ne (.String "amount_label") "" }} · {{ .String "amount_label" }}{{ end }}
                  {{ if and (ne (.String "resets_at") "") (not (.Bool "idle")) }}{{ $s := sub (toFloat (.Int "resets_at")) (toFloat $now) }}
                  · resets in {{ if ge $s 172800.0 }}{{ printf "%.0f" (div $s 86400.0) }}d{{ else if ge $s 3600.0 }}{{ $si := toInt $s }}{{ div (toFloat $si) 3600.0 | toInt | printf "%dh" }} {{ printf "%02dm" (toInt (div (toFloat (mod $si 3600)) 60.0)) }}{{ else }}{{ printf "%.0f" (div $s 60.0) }}m{{ end }}
                  {{ end }}
                </div>
                {{ end }}
              </div>
              {{ end }}
            </div>

        - type: custom-api
          title: Tailscale Devices
          title-url: https://login.tailscale.com/admin/machines
          url: https://api.tailscale.com/api/v2/tailnet/-/devices
          headers:
            Authorization: Bearer ${TAILSCALE_API_KEY}
          cache: 3m
          subrequests:
            names:
              # nodeId -> MagicDNS name, written by scripts/tailscale_names.sh (shared devices have no name in the API)
              url: http://localhost:8080/assets/tailscale/names.json
          options:
            # collapseAfter: 4
            # disableOfflineIndicator: true
            # disableUpdateIndicator: true
            # prioritiseTags: true
          template: |
            <style>
              .device-info-container-tailscale {
                position: relative;
                overflow: hidden;
                height: 1.5em;
              }

              .device-info-tailscale {
                display: flex;
                transition: transform 0.2s ease, opacity 0.2s ease;
              }

              .device-ip-tailscale {
                position: absolute;
                top: 0;
                left: 0;
                transform: translateY(-100%);
                opacity: 0;
                transition: transform 0.2s ease, opacity 0.2s ease;
              }

              .device-info-container-tailscale:hover .device-info-tailscale {
                transform: translateY(100%);
                opacity: 0;
              }

              .device-info-container-tailscale:hover .device-ip-tailscale {
                transform: translateY(0);
                opacity: 1;
              }

              .update-indicator-tailscale {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: var(--color-primary);
                display: inline-block;
                margin-left: 4px;
                vertical-align: middle;
              }

              .offline-indicator-tailscale {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background-color: var(--color-negative);
                display: inline-block;
                margin-left: 4px;
                vertical-align: middle;
              }

              .device-name-container-tailscale {
                display: flex;
                align-items: center;
                gap: 8px;
              }

              .indicators-container-tailscale {
                display: flex;
                align-items: center;
                gap: 4px;
              }
            </style>
            <ul class="list list-gap-10 collapsible-container" data-collapse-after="{{ .Options.IntOr "collapseAfter" 3 }}">
              {{ $names := .Subrequest "names" }}
              {{ range .JSON.Array "devices" }}{{ if not (.Bool "isExternal") }}
              <li>
                <div class="flex items-center gap-10">
                  <div class="device-name-container-tailscale grow">
                    <span class="size-h4 block text-truncate color-primary">
                      {{ if .String "name" }}{{ findMatch "^([^.]+)" (.String "name") }}{{ else }}{{ with $names.JSON.String (.String "nodeId") }}{{ . }}{{ else }}{{ .String "hostname" }}{{ end }}{{ end }}
                    </span>
                    <div class="indicators-container-tailscale">
                      {{ if and (not ($.Options.BoolOr "disableUpdateIndicator" false)) (.Bool "updateAvailable") }}
                      <span class="update-indicator-tailscale" data-popover-type="text" data-popover-text="Update Available"></span>
                      {{ end }}

                      {{ if not ($.Options.BoolOr "disableOfflineIndicator" false) }}
                      {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
                      {{ if not (.Bool "connectedToControl") }}
                      {{ $lastSeenTimezoned := $lastSeen.In now.Location }}
                      <span class="offline-indicator-tailscale" data-popover-type="text"
                        data-popover-text="Offline - Last seen {{ $lastSeenTimezoned.Format " Jan 2 3:04pm" }}"></span>
                      {{ end }}
                      {{ end }}

                    </div>
                  </div>
                </div>
                <div class="device-info-container-tailscale">
                  <ul class="list-horizontal-text device-info-tailscale">
                    <li>{{ .String "os" }}</li>
                    <li>
                      {{ if and ($.Options.BoolOr "prioritiseTags" false) (.Exists "tags.0") }}
                        {{ trimPrefix "tag:" (.String "tags.0") }}
                      {{ else if .Bool "isExternal" }}
                        shared
                      {{ else }}
                        {{ .String "user" }}
                      {{ end }}
                    </li>
                  </ul>
                  <div class="device-ip-tailscale">
                    {{ .String "addresses.0"}}
                  </div>
                </div>
              </li>
              {{ end }}{{ end }}
              {{ range .JSON.Array "devices" }}{{ if .Bool "isExternal" }}
              <li>
                <div class="flex items-center gap-10">
                  <div class="device-name-container-tailscale grow">
                    <span class="size-h4 block text-truncate color-primary">
                      {{ if .String "name" }}{{ findMatch "^([^.]+)" (.String "name") }}{{ else }}{{ with $names.JSON.String (.String "nodeId") }}{{ . }}{{ else }}{{ .String "hostname" }}{{ end }}{{ end }}
                    </span>
                    <div class="indicators-container-tailscale">
                      {{ if and (not ($.Options.BoolOr "disableUpdateIndicator" false)) (.Bool "updateAvailable") }}
                      <span class="update-indicator-tailscale" data-popover-type="text" data-popover-text="Update Available"></span>
                      {{ end }}

                      {{ if not ($.Options.BoolOr "disableOfflineIndicator" false) }}
                      {{ $lastSeen := .String "lastSeen" | parseTime "rfc3339" }}
                      {{ if not (.Bool "connectedToControl") }}
                      {{ $lastSeenTimezoned := $lastSeen.In now.Location }}
                      <span class="offline-indicator-tailscale" data-popover-type="text"
                        data-popover-text="Offline - Last seen {{ $lastSeenTimezoned.Format " Jan 2 3:04pm" }}"></span>
                      {{ end }}
                      {{ end }}

                    </div>
                  </div>
                </div>
                <div class="device-info-container-tailscale">
                  <ul class="list-horizontal-text device-info-tailscale">
                    <li>{{ .String "os" }}</li>
                    <li>
                      {{ if and ($.Options.BoolOr "prioritiseTags" false) (.Exists "tags.0") }}
                        {{ trimPrefix "tag:" (.String "tags.0") }}
                      {{ else if .Bool "isExternal" }}
                        shared
                      {{ else }}
                        {{ .String "user" }}
                      {{ end }}
                    </li>
                  </ul>
                  <div class="device-ip-tailscale">
                    {{ .String "addresses.0"}}
                  </div>
                </div>
              </li>
              {{ end }}{{ end }}
            </ul>

    - size: full
      widgets:
        - type: monitor
          title: "Local Services"
          cache: 1m
          sites:
            - title: OpenCode Web
              url: https://fibrilinux.burmese-neon.ts.net:4011
              check-url: https://fibrilinux.burmese-neon.ts.net:4011
              icon: si:openai
              basic-auth:
                username: ${OPENCODE_SERVER_USERNAME}
                password: ${OPENCODE_SERVER_PASSWORD}

            - title: OpenCode 2 Beta
              url: https://fibrilinux.burmese-neon.ts.net:4012
              check-url: https://fibrilinux.burmese-neon.ts.net:4012
              icon: si:openai
              basic-auth:
                username: opencode
                password: ${OPENCODE_SERVER_PASSWORD}

            - title: Youtube Music API
              url: http://100.87.0.66:8078
              check-url: http://100.87.0.66:8078/api/health?type=ytmusic
              icon: si:youtubemusic

            - title: CodexBar
              url: https://fibrilinux.burmese-neon.ts.net:8081
              check-url: http://100.87.0.66:18081/health
              icon: si:openai

            - title: Wiki MCP
              url: https://fibrilinux.burmese-neon.ts.net/health
              check-url: https://fibrilinux.burmese-neon.ts.net/health
              icon: si:obsidian

            - title: YNAB Dashboard
              url: https://fibrilinux.burmese-neon.ts.net:8086
              check-url: https://fibrilinux.burmese-neon.ts.net:8086/healthz
              icon: mdi:wallet

            - title: Usage Dashboard
              url: https://fibrilinux.burmese-neon.ts.net:8084
              check-url: https://fibrilinux.burmese-neon.ts.net:8084/api/now
              icon: mdi:gauge

        - type: docker-containers
          hide-by-default: false

        - type: custom-api
          title: What's Up Docker?
          cache: 1h
          url: http://${WUD_URL}/api/containers/
          method: GET
          template: |
            {{/* You are using WUD Monitor v2.0*/}}
            <style>
              .vertical-separator {
                width: 3px;
                height: 3.5rem;
                margin: 0 1rem;
                border-radius: 2px;
                align-self: center;
                background: linear-gradient(
                  to bottom,
                  transparent,
                  rgba(255, 255, 255, 0.05) 20%,
                  rgba(255, 255, 255, 0.05) 80%,
                  transparent
                );
              }

              .container-info {
                display: flex;
                align-items: flex-start;
                justify-content: space-evenly;
                margin: 1rem 0;
                width: 100%;
              }

              .info-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: 4rem;
              }

              .info-label {
                font-size: 1.20rem;
                opacity: 0.9;
                text-align: center;
              }

              .info-value {
                font-size: 1.4rem;
                margin-top: 0.25rem;
                text-align: center;
              }

              .info-count {
                font-size: 1.45rem !important;
              }

              /* Container Size: Full */
              @container widget (min-width: 550px) {
                .container-info {
                  justify-content: flex-start;
                  gap: 2rem;
                  padding: 0.5rem;
                }

                .vertical-separator {
                  align-self: flex-start;
                  margin: 0 2rem;
                }

                .info-column {
                  align-items: flex-start;
                }

                .info-label .info-value {
                  text-align: left;
                }
              }
            </style>

            {{/* ======================= MENU ======================= */}}
            {{ $showInfo := true }}         {{/* Show the overall info summary (Updates, Total, Running) */}}
            {{ $showList := true }}         {{/* Show the container list section */}}
            {{ $showAll := false }}         {{/* Show all containers (not just ones with updates) */}}
            {{ $showUpdateKind := true }}   {{/* Toggle this to false to hide the Update Kind row */}}
            {{ $showUpdateTypes := false }} {{/* Toggle this to false to hide the Update Types breakdown */}}
            {{ $showLocalVersion := true }} {{/* Toggle this to true to show local version instead of update status */}}
            {{ $hasUpdates := false }}      {{/* Set this to true to hide up-to-date message */}}

            {{ $containers := .JSON.Array "" }}
            {{ $total := len $containers }}
            {{ $updates := 0 }}
            {{ $running := 0 }}

            {{ range $containers }}
              {{ if .Bool "updateAvailable" }}
                {{ $updates = add $updates 1 }}
              {{ end }}
              {{ if eq (.String "status") "running" }}
                {{ $running = add $running 1 }}
              {{ end }}
            {{ end }}

            {{ if $showInfo }}
              <div class="container-info">
                <div class="info-column">
                  <div class="info-label info-count">Updates</div>
                  <div class="info-value info-count">{{ $updates }}</div>
                </div>

                <div class="vertical-separator"></div>

                <div class="info-column">
                  <div class="info-label info-count">Total</div>
                  <div class="info-value info-count">{{ $total }}</div>
                </div>

                <div class="vertical-separator"></div>

                <div class="info-column">
                  <div class="info-label info-count">Running</div>
                  <div class="info-value info-count">{{ $running }}</div>
                </div>
              </div>
              {{ if $showUpdateTypes }}
              <div class="flex items-center text-center">
                {{ $majorCount := 0 }}
                {{ $minorCount := 0 }}
                {{ $patchCount := 0 }}
                {{ $unknownCount := 0 }}
                {{ range $containers }}
                  {{ if .Bool "updateAvailable" }}
                    {{ $kind := .String "updateKind.semverDiff" }}
                    {{ if eq $kind "major" }}
                      {{ $majorCount = add $majorCount 1 }}
                    {{ else if eq $kind "minor" }}
                      {{ $minorCount = add $minorCount 1 }}
                    {{ else if eq $kind "patch" }}
                      {{ $patchCount = add $patchCount 1 }}
                    {{ else }}
                      {{ $unknownCount = add $unknownCount 1 }}
                    {{ end }}
                  {{ end }}
                {{ end }}
                <div class="flex-1">
                  <div class="size-h3">{{ $majorCount }}</div>
                  <div class="size-h6">MAJOR</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $minorCount }}</div>
                  <div class="size-h6">MINOR</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $patchCount }}</div>
                  <div class="size-h6">PATCH</div>
                </div>
                <div class="vertical-separator" style="width: 2px; margin: 0 0.25rem;"></div>
                <div class="flex-1">
                  <div class="size-h3">{{ $unknownCount }}</div>
                  <div class="size-h6">UNKNOWN</div>
                </div>
              </div>
              {{ end }}
            {{ end }}

            {{ if $showList }}
              <div style="height: 10px;"></div>
              <ul class="list list-gap-10 collapsible-container" data-collapse-after="3">
                {{ range $index, $container := $containers }}
                  {{ if $container.Bool "updateAvailable" }}
                    {{ $hasUpdates = true }}
                    <li>
                      <div class="flex flex-column">
                        {{ $registryName := $container.String "image.registry.name" }}
                        {{ $imageName := $container.String "image.name" }}
                        {{ $hubSource := "#" }}
                        {{ if eq $registryName "hub.public" }}
                          {{ $hubSource = concat "https://hub.docker.com/r/" $imageName }}
                        {{ else if eq $registryName "ghcr.public" }}
                          {{ $hubSource = concat "https://github.com/" $imageName }}
                        {{ end }}

                        <div class="size-h4">
                          {{ if eq ($container.String "status") "running" }}
                            <span class="status-dot color-positive">●</span>
                          {{ else }}
                            <span class="status-dot color-negative">●</span>
                          {{ end }}
                          <a class="color-highlight text-truncate" href="{{ $hubSource }}" target="_blank" rel="noreferrer">{{ $container.String "name" }}</a>
                        </div>

                        <div class="container-info">
                          <div class="info-column">
                            <div class="info-label">Watcher</div>
                            <div class="info-value">{{ $container.String "watcher" }}</div>
                          </div>

                          <div class="vertical-separator"></div>

                          {{ if $showLocalVersion }}
                            <div class="info-column">
                              <div class="info-label">Version</div>
                              <div class="info-value">
                          {{ $localValue := $container.String "updateKind.localValue" }}
                          {{ if ge (len $localValue) 7 }}
                            {{ $isSha256 := eq (slice $localValue 0 7) "sha256:" }}
                            {{ if $isSha256 }}
                              {{ $shortDigest := slice $localValue 7 11 }}
                              <span>dig: {{ $shortDigest }}</span>
                            {{ else }}
                              <span>{{ $localValue }}</span>
                            {{ end }}
                            {{ else }}
                              <span>{{ $localValue }}</span>
                            {{ end }}
                              </div>
                            </div>
                          {{ else }}
                            <div class="info-column">
                              <div class="info-label">Update</div>
                              <div class="info-value">
                                <span class="color-positive">Available</span>
                              </div>
                            </div>
                          {{ end }}
                          {{ if $showUpdateKind }}
                            <div class="vertical-separator"></div>
                            {{ $updateKind := $container.String "updateKind.semverDiff" }}
                            {{ if eq $updateKind "" }}
                              {{ $updateKind = "Unknown" }}
                            {{ end }}
                            {{ $tagValue := $container.String "updateKind.remoteValue" }}
                            {{ if eq $tagValue "" }}
                              {{ $tagValue = "Unknown" }}
                            {{ end }}
                            <div class="info-column">
                              <div class="info-label">{{ $updateKind }}</div>
                              <div class="info-value">
                                {{ if ge (len $tagValue) 7 }}
                                  {{ $isSha256 := eq (slice $tagValue 0 7) "sha256:" }}
                                  {{ if $isSha256 }}
                                    {{ $shortDigest := slice $tagValue 7 11 }}
                                    <span>dig: {{ $shortDigest }}</span>
                                  {{ else }}
                                    <span>{{ $tagValue }}</span>
                                  {{ end }}
                                  {{ else }}
                                    <span>{{ $tagValue }}</span>
                                  {{ end }}
                              </div>
                            </div>
                          {{ end }}
                        </div>
                      </div>
                    </li>
                  {{ end }}
                {{ end }}

                {{ if not $hasUpdates }}
                  <li class="flex items-center justify-center">
                    <span class="color-positive size-h4">All containers are up to date!</span>
                  </li>
                {{ end }}

                {{ if $showAll }}
                  {{ range $index, $container := $containers }}
                    {{ if not ($container.Bool "updateAvailable") }}
                      <li>
                        <div class="flex flex-column">
                          {{ $registryName := $container.String "image.registry.name" }}
                          {{ $imageName := $container.String "image.name" }}
                          {{ $hubSource := "#" }}
                          {{ if eq $registryName "hub.public" }}
                            {{ $hubSource = concat "https://hub.docker.com/r/" $imageName }}
                          {{ else if eq $registryName "ghcr.public" }}
                            {{ $hubSource = concat "https://github.com/" $imageName }}
                          {{ end }}

                          <div class="size-h4">
                            {{ if eq ($container.String "status") "running" }}
                              <span class="status-dot color-positive">●</span>
                            {{ else }}
                              <span class="status-dot color-negative">●</span>
                            {{ end }}
                            <a class="color-highlight text-truncate" href="{{ $hubSource }}" target="_blank" rel="noreferrer">{{ $container.String "name" }}</a>
                          </div>

                          <div class="container-info">
                            <div class="info-column">
                              <div class="info-label">Watcher</div>
                              <div class="info-value">{{ $container.String "watcher" }}</div>
                            </div>

                            <div class="vertical-separator"></div>

                            {{ if $showLocalVersion }}
                              <div class="info-column">
                                <div class="info-label">Version</div>
                                <div class="info-value">
                                  {{ $localValue := $container.String "updateKind.localValue" }}
                                  {{ if eq $localValue "" }}
                                    {{ $localValue = $container.String "updatekind.remoteValue" }}
                                    {{ if eq $localValue "" }}
                                      {{ $imageDigest := $container.String "image.digest.repo" }}
                                      {{ $isSha256 := eq (slice $imageDigest 0 7) "sha256:" }}
                                      {{ if $isSha256 }}
                                        {{ $shortDigest := slice $imageDigest 7 11 }}
                                        <span>dig: {{ $shortDigest }}</span>
                                      {{ else }}
                                        <span>-</span>
                                      {{ end }}
                                    {{ else }}
                                      <span>{{ $localValue }}</span>
                                    {{ end }}
                                  {{ else }}
                                    {{ $isSha256 := eq (slice $localValue 0 7) "sha256:" }}
                                    {{ if $isSha256 }}
                                      {{ $shortDigest := slice $localValue 7 11 }}
                                      <span>dig: {{ $shortDigest }}</span>
                                    {{ else }}
                                      <span>{{ $localValue }}</span>
                                    {{ end }}
                                  {{ end }}
                                </div>
                              </div>
                            {{ else }}
                              <div class="info-column">
                                <div class="info-label">Update</div>
                                <div class="info-value"><span class="color-negative">Not Found</span></div>
                              </div>
                            {{ end }}
                          </div>
                        </div>
                      </li>
                    {{ end }}
                  {{ end }}
                {{ end }}
              </ul>
            {{ end }}

        - type: custom-api
          title: NextDNS Analytics
          title-url: https://api.nextdns.io/profiles/${NEXTDNS_PROFILE_ID}/analytics/status
          cache: 1h
          url: https://api.nextdns.io/profiles/${NEXTDNS_PROFILE_ID}/analytics/status
          headers:
            X-Api-Key: ${NEXTDNS_API_KEY}
          template: |
            {{ if eq .Response.StatusCode 200 }}
              <div style="display: flex; justify-content: space-between;">
                {{ $total := 0.0 }}
                {{ $blocked := 0.0 }}
                {{ range .JSON.Array "data" }}
                  {{ $total = add $total (.Int "queries" | toFloat) }}
                  {{ if eq (.String "status") "blocked" }}
                    {{ $blocked = add $blocked (.Int "queries" | toFloat) }}
                  {{ end }}
                {{ end }}
                <div style="flex: 1; text-align: center;">
                  <p>Queries</p>
                  <p>{{ printf "%.0f" $total }}</p>
                </div>
                <div style="flex: 1; text-align: center; color: var(--color-negative);">
                  <p>Blocked</p>
                  <p>{{ printf "%.0f" $blocked }}</p>
                </div>
                <div style="flex: 1; text-align: center;">
                  <p>Block Rate</p>
                  {{ if gt $total 0.0 }}
                    <p>{{ div (mul $blocked 100) $total | printf "%.2f" }}%</p>
                  {{ else }}
                    <p>0.00%</p>
                  {{ end }}
                </div>
              </div>
            {{ else }}
              <div style="text-align: center; color: var(--color-negative);">
                Error: {{ .Response.StatusCode }} - {{ .Response.Status }}
              </div>
            {{ end }}

        - type: releases
          cache: 1d
          # Without authentication the Github API allows for up to 60 requests per hour. You can create a
          # read-only token from your Github account settings and use it here to increase the limit.
          token: ${GITHUB_TOKEN}
          repositories:
            - Apollo-Reborn/Apollo-Reborn
            - Balackburn/Apollo
            - glanceapp/glance
            - dockerhub:stnsmith/fossflow
            - dockerhub:iib0011/omni-tools
            - dockerhub:stirlingtools/stirling-pdf
